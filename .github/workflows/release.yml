name: release

on:
  push:
    tags:
      - 'v*'
  # Manual fallback in case a tag push doesn't trigger automatically.
  # The tag must already exist; the release is built from it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PUBLISH_FRAMEWORK: net10.0
  # The tag being released: explicit input for manual runs, otherwise the pushed tag.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    # Ignore stray branch pushes â€” this workflow only publishes version tags.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - rid: win-x64
            asset: windows-x64
            ext: .exe
            compress: zip
          - rid: win-arm64
            asset: windows-arm64
            ext: .exe
            compress: zip
          - rid: linux-x64
            asset: linux-x64
            ext: ''
            compress: tar.gz
          - rid: linux-arm64
            asset: linux-arm64
            ext: ''
            compress: tar.gz
          - rid: linux-musl-x64
            asset: linux-musl-x64
            ext: ''
            compress: tar.gz
          - rid: osx-x64
            asset: macos-x64
            ext: ''
            compress: tar.gz
          - rid: osx-arm64
            asset: macos-arm64
            ext: ''
            compress: tar.gz
      fail-fast: false

    runs-on: ${{ contains(matrix.rid, 'win') && 'windows-latest' || contains(matrix.rid, 'osx') && 'macos-latest' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Publish (${{ matrix.rid }})
        run: dotnet publish src/dbsh.CLI \
          --configuration Release \
          --framework ${{ env.PUBLISH_FRAMEWORK }} \
          --runtime ${{ matrix.rid }} \
          --self-contained true \
          --output ./publish/${{ matrix.rid }} \
          -p:PublishSingleFile=true \
          -p:DebugType=none

      - name: Rename binary
        shell: bash
        run: |
          mv ./publish/${{ matrix.rid }}/dbsh${{ matrix.ext }} ./dbsh${{ matrix.ext }}

      - name: Compress (zip)
        if: matrix.compress == 'zip'
        run: Compress-Archive -Path ./dbsh.exe -DestinationPath ./dbsh-${{ matrix.asset }}.zip

      - name: Compress (tar.gz)
        if: matrix.compress == 'tar.gz'
        run: tar -czf ./dbsh-${{ matrix.asset }}.tar.gz ./dbsh${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbsh-${{ matrix.asset }}
          path: ./dbsh-${{ matrix.asset }}.*
          if-no-files-found: error

  publish-nuget:
    needs: build
    # Job-level if cannot reference the secrets context, so we only gate on the
    # trigger here and check NUGET_API_KEY per step (see "Check NuGet API key").
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Check NuGet API key
        id: nuget
        env:
          KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NUGET_API_KEY secret is not set; skipping NuGet publish."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        if: steps.nuget.outputs.enabled == 'true'
        run: dotnet pack src/dbsh.CLI \
          --configuration Release \
          --output ./nupkg \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg \
          -p:ContinuousIntegrationBuild=true

      - name: Push to NuGet
        if: steps.nuget.outputs.enabled == 'true'
        run: dotnet nuget push ./nupkg/*.nupkg \
          --source https://api.nuget.org/v3/index.json \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --skip-duplicate

      - name: Upload NuGet package
        if: steps.nuget.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*.nupkg

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./release-artifacts

      - name: Generate SHA256SUMS
        working-directory: ./release-artifacts
        run: |
          # Build a SHA256SUMS file that covers every shipped archive plus the
          # install scripts so consumers can verify integrity end-to-end.
          (
            shopt -s nullglob
            for f in dbsh-*.zip dbsh-*.tar.gz; do
              [ -f "$f" ] && sha256sum "$f"
            done
          ) > ./SHA256SUMS
          # Include the install scripts too â€” they are referenced from the same release.
          cp ../install.sh .
          cp ../install.ps1 .
          sha256sum install.sh install.ps1 >> ./SHA256SUMS
          sort -o ./SHA256SUMS ./SHA256SUMS -k2

      - name: Generate release notes
        id: notes
        run: |
          TAG="${RELEASE_TAG}"
          cat <<EOF > ./release-notes.md
          # dbsh $TAG

          ## Installation

          \`\`\`bash
          # Linux / macOS
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/$TAG/install.sh | bash

          # Windows
          powershell -c "iwr -Uri https://github.com/${{ github.repository }}/releases/download/$TAG/install.ps1 | iex"
          \`\`\`

          The install scripts automatically verify the downloaded archive against
          \`SHA256SUMS\` published alongside this release.

          > **.NET global tool** (\`dotnet tool install --global dbsh\`) will be available once the package is published to NuGet.

          > **macOS users:** the first time you run \`dbsh\`, Gatekeeper may
          > quarantine the binary. Remove the quarantine attribute with:
          > \`\`\`bash
          > xattr -d com.apple.quarantine "$(which dbsh)"
          > \`\`\`

          ## Downloads

          | Platform | Package |
          |----------|--------|
          | Windows x64 | \`dbsh-windows-x64.zip\` |
          | Windows ARM64 | \`dbsh-windows-arm64.zip\` |
          | Linux x64 | \`dbsh-linux-x64.tar.gz\` |
          | Linux ARM64 | \`dbsh-linux-arm64.tar.gz\` |
          | Linux musl x64 (Alpine) | \`dbsh-linux-musl-x64.tar.gz\` |
          | macOS x64 | \`dbsh-macos-x64.tar.gz\` |
          | macOS ARM64 | \`dbsh-macos-arm64.tar.gz\` |

          ## Verifying integrity

          Every archive is checksummed in \`SHA256SUMS\` (attached to this release).
          The install scripts download and verify it automatically; to verify
          manually:

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/$TAG/SHA256SUMS | sha256sum -c -
          \`\`\`

          ---

          ## Changelog

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md) for details.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: dbsh ${{ env.RELEASE_TAG }}
          body_path: ./release-notes.md
          draft: false
          prerelease: false
          files: |
            ./install.sh
            ./install.ps1
            ./release-artifacts/dbsh-*.zip
            ./release-artifacts/dbsh-*.tar.gz
            ./release-artifacts/SHA256SUMS
